services:
    mysql-test:
        build:
            context: ../..
            dockerfile: /LocalTestDatabase.Dockerfile
        container_name: laravel-mysql-test
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: testing
        volumes:
            - mysql-test-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
            interval: 3s
            timeout: 3s
            retries: 10

volumes:
    mysql-test-data:
